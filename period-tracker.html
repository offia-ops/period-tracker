    const FLOW_OPTIONS = ['少', '中', '多'];

    // --- 工具函數 (Date Helpers) ---
    const formatDateObj = (dateObj) => {
      if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) return '';
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // 將各種可能的日期格式統一正規化為 "YYYY-MM-DD"
    const normalizeDateStr = (val) => {
      if (!val) return '';
      const str = String(val).trim();
      
      // 已經是標準 YYYY-MM-DD 格式
      const isoRegex = new RegExp('^\\d{4}-\\d{2}-\\d{2}$');
      if (isoRegex.test(str)) return str;
      
      // 處理 YYYY/M/D 或 YYYY-M-D
      const slashRegex = new RegExp('^(\\d{4})[/\\-](\\d{1,2})[/\\-](\\d{1,2})');
      const slashMatch = str.match(slashRegex);
      if (slashMatch) {
        return `${slashMatch[1]}-${slashMatch[2].padStart(2, '0')}-${slashMatch[3].padStart(2, '0')}`;
      }

      // 處理 "Tue Jun 09 2026 00:00:00 GMT+0800 (台北標準時間)" 這類帶有括號時區的字串
      const parenRegex = new RegExp('\\s*\\(.*?\\)\\s*', 'g');
      const cleanedStr = str.replace(parenRegex, '');
      const parsed = new Date(cleanedStr);
      if (!isNaN(parsed.getTime())) {
        return formatDateObj(parsed);
      }

      return str;
    };

    const parseDateStr = (dateStr) => {
      const norm = normalizeDateStr(dateStr);
      const isoRegex = new RegExp('^\\d{4}-\\d{2}-\\d{2}$');
      if (!norm || !isoRegex.test(norm)) return new Date();
      const [y, m, d] = norm.split('-');
      return new Date(Number(y), Number(m) - 1, Number(d));
    };

    const addDays = (dateObj, days) => {
      const result = new Date(dateObj);
      result.setDate(result.getDate() + days);
      return result;
    };

    const isDateBetween = (targetStr, startStr, endStr) => {
      const s = normalizeDateStr(startStr);
      const e = normalizeDateStr(endStr);
      return targetStr >= s && targetStr <= e;
    };

    const calcDaysDiff = (startStr, endStr) => {
      const sNorm = normalizeDateStr(startStr);
      const eNorm = normalizeDateStr(endStr);
      if (!sNorm || !eNorm) return 0;
      const s = parseDateStr(sNorm);
      const e = parseDateStr(eNorm);
      const diff = Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;
      return isNaN(diff) ? 0 : diff;
    };

    const normalizeRecord = (r) => ({

      endDate: normalizeDateStr(r.endDate),

    });

      // 從 Google Sheets 讀取資料

        if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) return;

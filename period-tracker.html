<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生理週期紀錄</title>
  
  <!-- 載入 Tailwind CSS 處理樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel 讓瀏覽器即時編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // 與 Google Sheets「週期統計分析」完全對齊的選項
    const SYMPTOM_OPTIONS = ['腹痛', '腰痠', '頭痛', '疲倦', '水腫', '情緒低落', '長痘痘', '胸部脹痛'];
    const FLOW_OPTIONS = ['少', '中', '多'];

    // --- 工具函數 (Date Helpers) ---
    const formatDateObj = (dateObj) => {
      if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) return '';
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // 將各種可能的日期格式（如 "Tue Jun 09 2026..." 或 "2026/6/9" 或 ISO 字串）統一正規化為 "YYYY-MM-DD"
    const normalizeDateStr = (val) => {
      if (!val) return '';
      const str = String(val).trim();
      
      // 已經是標準 YYYY-MM-DD 格式
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      
      // 處理 YYYY/M/D 或 YYYY-M-D
      const slashMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (slashMatch) {
        return `${slashMatch[1]}-${slashMatch[2].padStart(2, '0')}-${slashMatch[3].padStart(2, '0')}`;
      }

      // 處理 "Tue Jun 09 2026 00:00:00 GMT+0800 (台北標準時間)" 這類帶有中文括號時區的字串
      const cleanedStr = str.replace(/\s*\(.*?\)\s*/g, '');
      const parsed = new Date(cleanedStr);
      if (!isNaN(parsed.getTime())) {
        return formatDateObj(parsed);
      }

      return str;
    };

    const parseDateStr = (dateStr) => {
      const norm = normalizeDateStr(dateStr);
      if (!norm || !/^\d{4}-\d{2}-\d{2}$/.test(norm)) return new Date();
      const [y, m, d] = norm.split('-');
      return new Date(Number(y), Number(m) - 1, Number(d));
    };

    const addDays = (dateObj, days) => {
      const result = new Date(dateObj);
      result.setDate(result.getDate() + days);
      return result;
    };

    const isDateBetween = (targetStr, startStr, endStr) => {
      const s = normalizeDateStr(startStr);
      const e = normalizeDateStr(endStr);
      return targetStr >= s && targetStr <= e;
    };

    const calcDaysDiff = (startStr, endStr) => {
      const sNorm = normalizeDateStr(startStr);
      const eNorm = normalizeDateStr(endStr);
      if (!sNorm || !eNorm) return 0;
      const s = parseDateStr(sNorm);
      const e = parseDateStr(eNorm);
      const diff = Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;
      return isNaN(diff) ? 0 : diff;
    };

    // 正規化整筆紀錄
    const normalizeRecord = (r) => ({
      ...r,
      startDate: normalizeDateStr(r.startDate),
      endDate: normalizeDateStr(r.endDate),
      flow: r.flow || '中',
      symptoms: Array.isArray(r.symptoms) ? r.symptoms : [],
      notes: r.notes || ''
    });

    // --- 主元件 ---
    function App() {
      const [activeTab, setActiveTab] = useState('calendar'); 
      const [currentMonth, setCurrentMonth] = useState(() => {
        const today = new Date();
        return new Date(today.getFullYear(), today.getMonth(), 1);
      });
      
      // 狀態：synced | syncing | error
      const [syncStatus, setSyncStatus] = useState('synced');
      const [settings, setSettings] = useState({ cycleLength: 28, periodLength: 5 });
      const [records, setRecords] = useState([]);
      
      // 新增表單狀態
      const [newRecord, setNewRecord] = useState({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });
      const [showAddForm, setShowAddForm] = useState(false);
      
      // 編輯表單狀態
      const [editingRecordId, setEditingRecordId] = useState(null);
      const [editRecordData, setEditRecordData] = useState({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });

      // Google Sheets Web App URL
      const [sheetUrl, setSheetUrl] = useState('');

      // 備份與還原的狀態
      const [backupCode, setBackupCode] = useState('');
      const [importCode, setImportCode] = useState('');

      // 從 Google Sheets 讀取資料
      const fetchFromGoogleSheet = async (targetUrl = sheetUrl, silent = false) => {
        if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) return;
        
        setSyncStatus('syncing');
        try {
          const response = await fetch(targetUrl, { method: 'GET' });
          const result = await response.json();
          
          if (result.status === 'success' && Array.isArray(result.records)) {
            const normalizedRecords = result.records.map(normalizeRecord);
            setRecords(normalizedRecords);
            localStorage.setItem('menstrual_records', JSON.stringify(normalizedRecords));
            setSyncStatus('synced');
            if (!silent) alert(`🎉 成功從 Google Sheets 讀取 ${normalizedRecords.length} 筆紀錄！`);
          } else {
            throw new Error(result.message || '資料格式錯誤');
          }
        } catch (error) {
          console.error('從 Google Sheets 讀取失敗:', error);
          setSyncStatus('error');
          if (!silent) alert('❌ 讀取失敗，請確認網址是否正確，且 Apps Script 部署權限已設為「所有人」。');
        }
      };

      // 初次載入
      useEffect(() => {
        const savedSettings = localStorage.getItem('menstrual_settings');
        if (savedSettings) setSettings(JSON.parse(savedSettings));
        
        const savedSheetUrl = localStorage.getItem('menstrual_sheet_url');
        if (savedSheetUrl) setSheetUrl(savedSheetUrl);

        const savedRecords = localStorage.getItem('menstrual_records');
        if (savedRecords) {
          const parsed = JSON.parse(savedRecords).map(normalizeRecord);
          setRecords(parsed);
          localStorage.setItem('menstrual_records', JSON.stringify(parsed));
        } else {
          const today = new Date();
          setRecords([{
            id: '1',
            startDate: formatDateObj(addDays(today, -15)),
            endDate: formatDateObj(addDays(today, -11)),
            flow: '中',
            symptoms: [],
            notes: ''
          }]);
        }

        // 若已設定網址，啟動時自動從雲端拉取最新紀錄
        if (savedSheetUrl) {
          fetchFromGoogleSheet(savedSheetUrl, true);
        }
      }, []);

      // 寫入至 Google Sheets
      const syncToGoogleSheet = async (recordsToSync, targetUrl = sheetUrl) => {
        if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) {
          setSyncStatus('synced');
          return;
        }

        setSyncStatus('syncing');
        try {
          await fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify({
              settings: settings,
              records: recordsToSync.map(normalizeRecord)
            })
          });
          setSyncStatus('synced');
        } catch (error) {
          console.error('Google Sheets 同步失敗:', error);
          setSyncStatus('error');
        }
      };

      const saveData = (key, data) => {
        setSyncStatus('syncing');
        if (key === 'menstrual_records') {
          const cleanData = data.map(normalizeRecord);
          localStorage.setItem(key, JSON.stringify(cleanData));
          syncToGoogleSheet(cleanData);
        } else {
          localStorage.setItem(key, JSON.stringify(data));
          setTimeout(() => setSyncStatus('synced'), 400);
        }
      };

      const handleSaveSheetUrl = (url) => {
        const trimmed = url.trim();
        setSheetUrl(trimmed);
        localStorage.setItem('menstrual_sheet_url', trimmed);
      };

      // 切換症狀多選標籤
      const toggleSymptom = (currentSymptoms, symptom) => {
        if (currentSymptoms.includes(symptom)) {
          return currentSymptoms.filter(s => s !== symptom);
        } else {
          return [...currentSymptoms, symptom];
        }
      };

      const latestRecord = useMemo(() => {
        if (records.length === 0) return null;
        return [...records].sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
      }, [records]);

      const predictions = useMemo(() => {
        if (!latestRecord) return [];
        const preds = [];
        let currentCycleStart = parseDateStr(latestRecord.startDate);

        for (let i = 0; i <= 5; i++) {
          const nextCycleStart = addDays(currentCycleStart, settings.cycleLength);
          const currentCycleEnd = addDays(currentCycleStart, settings.periodLength - 1);
          const ovulation = addDays(nextCycleStart, -14);
          const fertileStart = addDays(ovulation, -5);
          const fertileEnd = addDays(ovulation, 1);

          preds.push({
            isPrediction: i > 0, 
            start: formatDateObj(currentCycleStart),
            end: formatDateObj(currentCycleEnd),
            ovulation: formatDateObj(ovulation),
            fertileStart: formatDateObj(fertileStart),
            fertileEnd: formatDateObj(fertileEnd)
          });
          currentCycleStart = nextCycleStart;
        }
        return preds;
      }, [latestRecord, settings]);

      const calendarDays = useMemo(() => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const days = [];
        for (let i = 0; i < firstDay; i++) days.push(null);
        
        for (let i = 1; i <= daysInMonth; i++) {
          const dateStr = formatDateObj(new Date(year, month, i));
          let type = 'safe'; 
          
          const isActualPeriod = records.some(r => isDateBetween(dateStr, r.startDate, r.endDate));
          let isPredictedPeriod = false;
          let isOvulation = false;
          let isFertile = false;

          for (const p of predictions) {
            if (p.isPrediction && isDateBetween(dateStr, p.start, p.end)) isPredictedPeriod = true;
            if (dateStr === p.ovulation) isOvulation = true;
            if (isDateBetween(dateStr, p.fertileStart, p.fertileEnd) && dateStr !== p.ovulation) isFertile = true;
          }

          if (isActualPeriod) type = 'actual_period';
          else if (isPredictedPeriod) type = 'predicted_period';
          else if (isOvulation) type = 'ovulation';
          else if (isFertile) type = 'fertile';

          days.push({ day: i, dateStr, type });
        }
        return days;
      }, [currentMonth, records, predictions]);

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!newRecord.startDate || !newRecord.endDate) return;
        const newId = Date.now().toString();
        const updatedRecords = [...records, normalizeRecord({ ...newRecord, id: newId })];
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
        setNewRecord({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });
        setShowAddForm(false);
      };

      const handleDeleteRecord = (id) => {
        if (!confirm('確定要刪除這筆紀錄嗎？')) return;
        const updatedRecords = records.filter(r => r.id !== id);
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
      };

      const handleSaveEdit = (id) => {
        if (!editRecordData.startDate || !editRecordData.endDate) return;
        const updatedRecords = records.map(r => 
          r.id === id ? normalizeRecord({ ...r, ...editRecordData }) : r
        );
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
        setEditingRecordId(null);
      };

      const handleBackToToday = () => {
        const today = new Date();
        setCurrentMonth(new Date(today.getFullYear(), today.getMonth(), 1));
      };

      // --- 跨裝置匯出/匯入邏輯 ---
      const handleExportData = () => {
        const exportData = {
          settings: settings,
          records: records.map(normalizeRecord)
        };
        const encodedData = btoa(encodeURIComponent(JSON.stringify(exportData)));
        setBackupCode(encodedData);
      };

      const handleImportData = () => {
        try {
          const decodedData = JSON.parse(decodeURIComponent(atob(importCode.trim())));
          
          if (decodedData.settings && decodedData.records) {
            setSettings(decodedData.settings);
            saveData('menstrual_settings', decodedData.settings);
            
            const normalized = decodedData.records.map(normalize

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生理週期紀錄</title>
  
  <!-- 載入 Tailwind CSS 處理樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel 讓瀏覽器即時編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // 預設症狀選項與流量選項
    const SYMPTOM_OPTIONS = ['腹痛', '腰痠', '頭痛', '疲倦', '水腫', '情緒低落', '長痘痘', '胸部脹痛'];
    const FLOW_OPTIONS = ['少', '中', '多'];

    // --- 工具函數 (Date Helpers) ---
    const parseDateStr = (dateStr) => {
      if (!dateStr) return new Date();
      const [y, m, d] = dateStr.split('-');
      return new Date(y, m - 1, d);
    };

    const formatDateObj = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const addDays = (dateObj, days) => {
      const result = new Date(dateObj);
      result.setDate(result.getDate() + days);
      return result;
    };

    const isDateBetween = (targetStr, startStr, endStr) => {
      return targetStr >= startStr && targetStr <= endStr;
    };

    const calcDaysDiff = (startStr, endStr) => {
      if (!startStr || !endStr) return 0;
      const s = parseDateStr(startStr);
      const e = parseDateStr(endStr);
      return Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;
    };

    // --- 主元件 ---
    function App() {
      const [activeTab, setActiveTab] = useState('calendar'); 
      const [currentMonth, setCurrentMonth] = useState(() => {
        const today = new Date();
        return new Date(today.getFullYear(), today.getMonth(), 1);
      });
      
      // 狀態：synced | syncing | error
      const [syncStatus, setSyncStatus] = useState('synced');
      const [settings, setSettings] = useState({ cycleLength: 28, periodLength: 5 });
      const [records, setRecords] = useState([]);
      
      // 新增表單狀態
      const [newRecord, setNewRecord] = useState({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });
      const [showAddForm, setShowAddForm] = useState(false);
      
      // 編輯表單狀態
      const [editingRecordId, setEditingRecordId] = useState(null);
      const [editRecordData, setEditRecordData] = useState({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });

      // Google Sheets Web App URL
      const [sheetUrl, setSheetUrl] = useState('');

      // 備份與還原的狀態
      const [backupCode, setBackupCode] = useState('');
      const [importCode, setImportCode] = useState('');

      // 從 Google Sheets 讀取資料
      const fetchFromGoogleSheet = async (targetUrl = sheetUrl, silent = false) => {
        if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) return;
        
        setSyncStatus('syncing');
        try {
          const response = await fetch(targetUrl, { method: 'GET' });
          const result = await response.json();
          
          if (result.status === 'success' && Array.isArray(result.records)) {
            setRecords(result.records);
            localStorage.setItem('menstrual_records', JSON.stringify(result.records));
            setSyncStatus('synced');
            if (!silent) alert(`🎉 成功從 Google Sheets 讀取 ${result.records.length} 筆紀錄！`);
          } else {
            throw new Error(result.message || '資料格式錯誤');
          }
        } catch (error) {
          console.error('從 Google Sheets 讀取失敗:', error);
          setSyncStatus('error');
          if (!silent) alert('❌ 讀取失敗，請確認網址是否正確且已部署「新版本」。');
        }
      };

      // 初次載入
      useEffect(() => {
        const savedSettings = localStorage.getItem('menstrual_settings');
        if (savedSettings) setSettings(JSON.parse(savedSettings));
        
        const savedSheetUrl = localStorage.getItem('menstrual_sheet_url');
        if (savedSheetUrl) setSheetUrl(savedSheetUrl);

        const savedRecords = localStorage.getItem('menstrual_records');
        if (savedRecords) {
          setRecords(JSON.parse(savedRecords));
        } else {
          const today = new Date();
          setRecords([{
            id: '1',
            startDate: formatDateObj(addDays(today, -15)),
            endDate: formatDateObj(addDays(today, -11)),
            flow: '中',
            symptoms: [],
            notes: ''
          }]);
        }

        // 若有綁定雲端網址，開啟時自動背景拉取最新資料
        if (savedSheetUrl) {
          fetchFromGoogleSheet(savedSheetUrl, true);
        }
      }, []);

      // 寫入至 Google Sheets
      const syncToGoogleSheet = async (recordsToSync, targetUrl = sheetUrl) => {
        if (!targetUrl || !targetUrl.startsWith('https://script.google.com/')) {
          setSyncStatus('synced');
          return;
        }

        setSyncStatus('syncing');
        try {
          await fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify({
              settings: settings,
              records: recordsToSync
            })
          });
          setSyncStatus('synced');
        } catch (error) {
          console.error('Google Sheets 同步失敗:', error);
          setSyncStatus('error');
        }
      };

      const saveData = (key, data) => {
        setSyncStatus('syncing');
        localStorage.setItem(key, JSON.stringify(data));
        if (key === 'menstrual_records') {
          syncToGoogleSheet(data);
        } else {
          setTimeout(() => setSyncStatus('synced'), 400);
        }
      };

      const handleSaveSheetUrl = (url) => {
        const trimmed = url.trim();
        setSheetUrl(trimmed);
        localStorage.setItem('menstrual_sheet_url', trimmed);
      };

      // 切換症狀多選標籤
      const toggleSymptom = (currentSymptoms, symptom) => {
        if (currentSymptoms.includes(symptom)) {
          return currentSymptoms.filter(s => s !== symptom);
        } else {
          return [...currentSymptoms, symptom];
        }
      };

      const latestRecord = useMemo(() => {
        if (records.length === 0) return null;
        return [...records].sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
      }, [records]);

      const predictions = useMemo(() => {
        if (!latestRecord) return [];
        const preds = [];
        let currentCycleStart = parseDateStr(latestRecord.startDate);

        for (let i = 0; i <= 5; i++) {
          const nextCycleStart = addDays(currentCycleStart, settings.cycleLength);
          const currentCycleEnd = addDays(currentCycleStart, settings.periodLength - 1);
          const ovulation = addDays(nextCycleStart, -14);
          const fertileStart = addDays(ovulation, -5);
          const fertileEnd = addDays(ovulation, 1);

          preds.push({
            isPrediction: i > 0, 
            start: formatDateObj(currentCycleStart),
            end: formatDateObj(currentCycleEnd),
            ovulation: formatDateObj(ovulation),
            fertileStart: formatDateObj(fertileStart),
            fertileEnd: formatDateObj(fertileEnd)
          });
          currentCycleStart = nextCycleStart;
        }
        return preds;
      }, [latestRecord, settings]);

      const calendarDays = useMemo(() => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const days = [];
        for (let i = 0; i < firstDay; i++) days.push(null);
        
        for (let i = 1; i <= daysInMonth; i++) {
          const dateStr = formatDateObj(new Date(year, month, i));
          let type = 'safe'; 
          
          const isActualPeriod = records.some(r => isDateBetween(dateStr, r.startDate, r.endDate));
          let isPredictedPeriod = false;
          let isOvulation = false;
          let isFertile = false;

          for (const p of predictions) {
            if (p.isPrediction && isDateBetween(dateStr, p.start, p.end)) isPredictedPeriod = true;
            if (dateStr === p.ovulation) isOvulation = true;
            if (isDateBetween(dateStr, p.fertileStart, p.fertileEnd) && dateStr !== p.ovulation) isFertile = true;
          }

          if (isActualPeriod) type = 'actual_period';
          else if (isPredictedPeriod) type = 'predicted_period';
          else if (isOvulation) type = 'ovulation';
          else if (isFertile) type = 'fertile';

          days.push({ day: i, dateStr, type });
        }
        return days;
      }, [currentMonth, records, predictions]);

      const handleAddRecord = (e) => {
        e.preventDefault();
        if (!newRecord.startDate || !newRecord.endDate) return;
        const newId = Date.now().toString();
        const updatedRecords = [...records, { ...newRecord, id: newId }];
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
        setNewRecord({ startDate: '', endDate: '', flow: '中', symptoms: [], notes: '' });
        setShowAddForm(false);
      };

      const handleDeleteRecord = (id) => {
        if (!confirm('確定要刪除這筆紀錄嗎？')) return;
        const updatedRecords = records.filter(r => r.id !== id);
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
      };

      const handleSaveEdit = (id) => {
        if (!editRecordData.startDate || !editRecordData.endDate) return;
        const updatedRecords = records.map(r => 
          r.id === id ? { ...r, ...editRecordData } : r
        );
        setRecords(updatedRecords);
        saveData('menstrual_records', updatedRecords);
        setEditingRecordId(null);
      };

      const handleBackToToday = () => {
        const today = new Date();
        setCurrentMonth(new Date(today.getFullYear(), today.getMonth(), 1));
      };

      // --- 跨裝置匯出/匯入邏輯 ---
      const handleExportData = () => {
        const exportData = {
          settings: settings,
          records: records
        };
        const encodedData = btoa(encodeURIComponent(JSON.stringify(exportData)));
        setBackupCode(encodedData);
      };

      const handleImportData = () => {
        try {
          const decodedData = JSON.parse(decodeURIComponent(atob(importCode.trim())));
          
          if (decodedData.settings && decodedData.records) {
            setSettings(decodedData.settings);
            saveData('menstrual_settings', decodedData.settings);
            
            setRecords(decodedData.records);
            saveData('menstrual_records', decodedData.records);
            
            setImportCode('');
            alert('🎉 資料還原成功！您的紀錄已同步到此裝置與 Google Sheets。');
          } else {
            alert('❌ 備份碼格式錯誤，請檢查是否複製完整。');
          }
        } catch (error) {
          alert('❌ 無效的備份碼，請檢查是否複製完整。');
        }
      };

      // --- 畫面渲染 ---
      const renderCalendar = () => (
        <div className="bg-white rounded-2xl shadow-sm p-4 animate-fade-in mb-20">
          <div className="flex justify-between items-center mb-6 relative">
            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1))} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition w-10 h-10 flex items-center justify-center">&lt;</button>
            <div className="text-center flex flex-col items-center">
              <h2 className="text-xl font-bold text-gray-800">{currentMonth.getFullYear()} 年 {currentMonth.getMonth() + 1} 月</h2>
              <button onClick={handleBackToToday} className="text-[11px] font-medium text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-full mt-1.5 transition-colors">回到今天</button>
            </div>
            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition w-10 h-10 flex items-center justify-center">&gt;</button>
          </div>

          <div className="grid grid-cols-7 gap-1 mb-2">
            {['日', '一', '二', '三', '四', '五', '六'].map(day => <div key={day} className="text-center text-xs font-medium text-gray-400 py-1">{day}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {calendarDays.map((cell, idx) => (
              <div key={idx} className="aspect-square flex items-center justify-center p-1">
                {cell && (
                  <div className={`w-full h-full flex items-center justify-center rounded-full text-sm font-medium transition-all cursor-default
                      ${cell.type === 'actual_period' ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : ''}
                      ${cell.type === 'predicted_period' ? 'bg-rose-200 text-rose-700' : ''}
                      ${cell.type === 'ovulation' ? 'bg-purple-500 text-white shadow-md shadow-purple-200' : ''}
                      ${cell.type === 'fertile' ? 'bg-purple-100 text-purple-700' : ''}
                      ${cell.type === 'safe' ? 'text-gray-600 hover:bg-gray-50' : ''}
                    `}>
                    {cell.day}
                  </div>
                )}
              </div>
            ))}
          </div>

          <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3 text-xs border-t pt-4">
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-rose-500"></div><span className="text-gray-600">實際月經</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-rose-200"></div><span className="text-gray-600">預測月經</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-purple-500"></div><span className="text-gray-600">排卵日</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-purple-100"></div><span className="text-gray-600">易孕期</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-transparent border border-gray-200"></div><span className="text-gray-600">安全期</span></div>
          </div>
        </div>
      );

      // 共用的表單欄位渲染（新增與編輯共用）
      const renderRecordFormFields = (data, setData) => (
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs text-gray-500 mb-1">開始日期</label>
              <input type="date" required value={data.startDate} onChange={e => setData({...data, startDate: e.target.value})} className="w-full text-sm border-gray-200 rounded-lg p-2 outline-none border bg-white"/>
            </div>
            <div>
              <label className="block text-xs text-gray-500 mb-1">結束日期</label>
              <input type="date" required value={data.endDate} onChange={e => setData({...data, endDate: e.target.value})} className="w-full text-sm border-gray-200 rounded-lg p-2 outline-none border bg-white"/>
            </div>
          </div>

          <div>
            <label className="block text-xs text-gray-500 mb-1.5">經血流量</label>
            <div className="grid grid-cols-3 gap-2">
              {FLOW_OPTIONS.map(option => (
                <button
                  type="button"
                  key={option}
                  onClick={() => setData({...data, flow: option})}
                  className={`py-1.5 text-xs font-medium rounded-lg border transition ${
                    data.flow === option 
                      ? 'bg-rose-500 text-white border-rose-500 shadow-sm' 
                      : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                  }`}
                >
                  💧 {option}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-xs text-gray-500 mb-1.5">不適症狀（可複選）</label>
            <div className="flex flex-wrap gap-1.5">
              {SYMPTOM_OPTIONS.map(symptom => {
                const isSelected = (data.symptoms || []).includes(symptom);
                return (
                  <button
                    type="button"
                    key={symptom}
                    onClick={() => setData({...data, symptoms: toggleSymptom(data.symptoms || [], symptom)})}
                    className={`px-2.5 py-1 text-xs rounded-full border transition ${
                      isSelected 
                        ? 'bg-amber-100 text-amber-800 border-amber-300 font-medium' 
                        : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'
                    }`}
                  >
                    {symptom}
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <label className="block text-xs text-gray-500 mb-1">備註</label>
            <input 
              type="text" 
              value={data.notes || ''} 
              onChange={e => setData({...data, notes: e.target.value})} 
              placeholder="例如：吃止痛藥、喝熱飲、作息熬夜..."
              className="w-full text-xs border-gray-200 rounded-lg p-2 outline-none border bg-white"
            />
          </div>
        </div>
      );

      const renderHistory = () => (
        <div className="bg-white rounded-2xl shadow-sm p-4 animate-fade-in mb-20">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-xl font-bold text-gray-800">歷年紀錄</h2>
            <button onClick={() => { setShowAddForm(!showAddForm); setEditingRecordId(null); }} className="text-sm bg-rose-50 text-rose-600 px-3 py-1.5 rounded-full hover:bg-rose-100 transition">{showAddForm ? '取消' : '➕ 新增紀錄'}</button>
          </div>
          
          {showAddForm && (
            <form onSubmit={handleAddRecord} className="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
              {renderRecordFormFields(newRecord, setNewRecord)}
              <button type="submit" className="w-full mt-4 bg-rose-500 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-rose-600 transition">儲存紀錄</button>
            </form>
          )}

          <div className="space-y-3">
            {records.length === 0 ? (
              <div className="text-center text-gray-400 py-8 text-sm">目前還沒有紀錄，點擊上方按鈕新增。</div>
            ) : (
              [...records].sort((a, b) => (a.startDate < b.startDate ? 1 : -1)).map(record => {
                if (editingRecordId === record.id) {
                  return (
                    <div key={record.id} className="p-4 border border-rose-200 rounded-xl bg-rose-50/70 shadow-sm">
                      {renderRecordFormFields(editRecordData, setEditRecordData)}
                      <div className="flex justify-end gap-2 mt-4">
                        <button onClick={() => setEditingRecordId(null)} className="px-4 py-1.5 text-sm text-gray-500 hover:bg-gray-200 rounded-lg">取消</button>
                        <button onClick={() => handleSaveEdit(record.id)} className="px-4 py-1.5 text-sm text-white bg-rose-500 hover:bg-rose-600 rounded-lg">儲存修改</button>
                      </div>
                    </div>
                  );
                }
                const daysCount = calcDaysDiff(record.startDate, record.endDate);
                return (
                  <div key={record.id} className="p-3.5 border border-gray-100 rounded-xl bg-white shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-3">
                        <div className="bg-rose-100 p-2 rounded-full text-rose-500 text-sm">🩸</div>
                        <div>
                          <div className="text-sm font-bold text-gray-800">{record.startDate} ~ {record.endDate}</div>
                          <div className="flex items-center gap-2 mt-1">
                            <span className="text-[11px] text-gray-500 bg-gray-100 px-2 py-0.5 rounded">共 {daysCount} 天</span>
                            <span className="text-[11px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded">流量：{record.flow || '中'}</span>
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-1">
                        <button onClick={() => {
                          setEditingRecordId(record.id); 
                          setEditRecordData({
                            startDate: record.startDate, 
                            endDate: record.endDate,
                            flow: record.flow || '中',
                            symptoms: record.symptoms || [],
                            notes: record.notes || ''
                          }); 
                          setShowAddForm(false);
                        }} className="text-gray-400 hover:text-blue-500 text-xs px-2 py-1">修改</button>
                        <button onClick={() => handleDeleteRecord(record.id)} className="text-gray-400 hover:text-red-500 text-xs px-2 py-1">刪除</button>
                      </div>
                    </div>

                    {/* 顯示症狀與備註 */}
                    {((record.symptoms && record.symptoms.length > 0) || record.notes) && (
                      <div className="mt-2.5 pt-2.5 border-t border-gray-50 pl-11 space-y-1.5">
                        {record.symptoms && record.symptoms.length > 0 && (
                          <div className="flex flex-wrap gap-1">
                            {record.symptoms.map(s => (
                              <span key={s} className="text-[10px] bg-amber-50 text-amber-700 border border-amber-200/60 px-2 py-0.5 rounded-full">
                                {s}
                              </span>
                            ))}
                          </div>
                        )}
                        {record.notes && (
                          <div className="text-xs text-gray-500">📝 {record.notes}</div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>
        </div>
      );

      const renderSettings = () => (
        <div className="bg-white rounded-2xl shadow-sm p-4 animate-fade-in mb-20">
          <h2 className="text-xl font-bold text-gray-800 mb-6">個人化設定</h2>
          
          <div className="space-y-6">
            <div>
              <div className="flex justify-between mb-2">
                <label className="text-sm font-medium text-gray-700">⏳ 平均月經週期</label>
                <span className="text-sm font-bold text-rose-500">{settings.cycleLength} 天</span>
              </div>
              <input type="range" name="cycleLength" min="21" max="45" value={settings.cycleLength} onChange={e => { const v = { ...settings, cycleLength: parseInt(e.target.value) }; setSettings(v); saveData('menstrual_settings', v); }} className="w-full accent-rose-500" />
            </div>
            
            <div>
              <div className="flex justify-between mb-2">
                <label className="text-sm font-medium text-gray-700">🩸 平均行經期長度</label>
                <span className="text-sm font-bold text-rose-500">{settings.periodLength} 天</span>
              </div>
              <input type="range" name="periodLength" min="3" max="10" value={settings.periodLength} onChange={e => { const v = { ...settings, periodLength: parseInt(e.target.value) }; setSettings(v); saveData('menstrual_settings', v); }} className="w-full accent-rose-500" />
            </div>
          </div>

          {/* Google Sheets 雙向同步區塊 */}
          <div className="mt-8 pt-6 border-t border-gray-100">
            <h3 className="text-base font-bold text-gray-800 mb-2">📊 Google Sheets 雙向同步</h3>
            <p className="text-xs text-gray-500 mb-3 leading-relaxed">
              貼上 Google Apps Script 網址後，新增或修改紀錄會自動寫入試算表；更換新裝置時也可直接從雲端拉回歷史資料。
            </p>
            <div className="bg-emerald-50/60 p-3 rounded-xl border border-emerald-100 space-y-2.5">
              <input 
                type="url" 
                value={sheetUrl}
                onChange={e => handleSaveSheetUrl(e.target.value)}
                placeholder="https://script.google.com/macros/s/.../exec"
                className="w-full text-xs text-gray-700 p-2.5 border border-gray-200 rounded-lg bg-white outline-none focus:border-emerald-400"
              />
              <div className="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => syncToGoogleSheet(records)}
                  disabled={!sheetUrl || syncStatus === 'syncing'}
                  className="bg-emerald-600 text-white rounded-lg py-2 text-xs font-medium hover:bg-emerald-700 disabled:opacity-50 transition"
                >
                  ⬆️ 上傳寫入雲端
                </button>
                <button 
                  onClick={() => fetchFromGoogleSheet(sheetUrl, false)}
                  disabled={!sheetUrl || syncStatus === 'syncing'}
                  className="bg-white text-emerald-700 border border-emerald-300 rounded-lg py-2 text-xs font-medium hover:bg-emerald-50 disabled:opacity-50 transition"
                >
                  ⬇️ 從雲端讀取還原
                </button>
              </div>
            </div>
          </div>

          {/* 跨裝置備份碼區塊 */}
          <div className="mt-8 pt-6 border-t border-gray-100">
            <h3 className="text-base font-bold text-gray-800 mb-2">🔄 離線備份碼轉移</h3>
            <p className="text-xs text-gray-500 mb-4 leading-relaxed">
              若未使用 Google Sheets，也可透過產生備份碼手動轉移資料。
            </p>

            <div className="space-y-4">
              <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                <button onClick={handleExportData} className="w-full bg-blue-50 text-blue-600 rounded-lg py-2 text-sm font-medium hover:bg-blue-100 transition mb-2">
                  1. 產生備份碼 (匯出)
                </button>
                {backupCode && (
                  <textarea 
                    readOnly 
                    value={backupCode} 
                    onClick={e => e.target.select()}
                    className="w-full text-[10px] text-gray-400 p-2 border border-blue-200 rounded-lg bg-white h-20 outline-none resize-none" 
                    placeholder="備份碼會顯示在這裡，請全選並複製..."
                  />
                )}
              </div>

              <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                <textarea 
                  value={importCode} 
                  onChange={e => setImportCode(e.target.value)} 
                  placeholder="2. 在此貼上從其他裝置複製的備份碼..." 
                  className="w-full text-[10px] text-gray-700 p-2 border border-gray-200 rounded-lg bg-white h-20 outline-none focus:border-rose-300 resize-none mb-2" 
                />
                <button 
                  onClick={handleImportData} 
                  disabled={!importCode.trim()} 
                  className="w-full bg-rose-500 text-white rounded-lg py-2 text-sm font-medium hover:bg-rose-600 disabled:opacity-50 transition"
                >
                  3. 還原資料 (匯入)
                </button>
              </div>
            </div>
          </div>

        </div>
      );

      return (
        <div className="min-h-screen">
          <header className="bg-white px-4 py-4 shadow-sm sticky top-0 z-10">
            <div className="max-w-md mx-auto flex items-center justify-between">
              <h1 className="text-lg font-bold text-gray-800">💖 生理週期紀錄</h1>
              <div className="text-xs font-medium">
                {syncStatus === 'syncing' && <span className="text-amber-500">☁️ 同步中...</span>}
                {syncStatus === 'synced' && <span className="text-emerald-500">{sheetUrl ? '✅ 已同步雲端' : '✅ 已儲存本機'}</span>}
                {syncStatus === 'error' && <span className="text-red-500">⚠️ 同步異常</span>}
              </div>
            </div>
          </header>
          <main className="max-w-md mx-auto p-4 pt-6">
            {activeTab === 'calendar' && renderCalendar()}
            {activeTab === 'history' && renderHistory()}
            {activeTab === 'settings' && renderSettings()}
          </main>
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <div className="max-w-md mx-auto flex justify-around">
              <button onClick={() => setActiveTab('calendar')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeTab === 'calendar' ? 'text-rose-500' : 'text-gray-400'}`}><span className="text-xl">📅</span><span className="text-[10px]">預測日曆</span></button>
              <button onClick={() => setActiveTab('history')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeTab === 'history' ? 'text-rose-500' : 'text-gray-400'}`}><span className="text-xl">⏳</span><span className="text-[10px]">歷年紀錄</span></button>
              <button onClick={() => setActiveTab('settings')} className={`flex-1 py-3 flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-rose-500' : 'text-gray-400'}`}><span className="text-xl">⚙️</span><span className="text-[10px]">設定</span></button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
